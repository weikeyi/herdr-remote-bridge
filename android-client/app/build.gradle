plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.herdrbridge.nativeclient'
    compileSdk 37
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'dev.herdrbridge.nativeclient.internal'
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName '0.1.0-internal-native'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        debug {
            debuggable false
        }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        checkTestSources true
        abortOnError true
        warningsAsErrors false
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:5.5.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

android.sourceSets.main.java.srcDirs += ["../../java/src/main/java"]

android.sourceSets.androidTest.java.srcDirs += ["../../java/src/test/java"]
android.sourceSets.androidTest.assets.srcDirs += ["../../java/fixtures"]
dependencies {
    testImplementation 'org.json:json:20240303'
}
