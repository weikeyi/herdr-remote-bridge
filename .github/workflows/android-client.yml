name: Independent Android reader preview

on:
  push:
    branches: [dev, 'android/**']
    paths: ['android-client/**', '.github/workflows/android-client.yml']
  pull_request:
    branches: [dev]
    paths: ['android-client/**', '.github/workflows/android-client.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-preview-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Bootstrap checksum-pinned Android SDK
        run: bash scripts/setup-ci-sdk.sh
      - name: Verify Gradle wrapper JAR
        run: sha256sum -c gradle/wrapper/gradle-wrapper.jar.sha256
      - name: Assemble, lint and unit tests
        run: bash ./gradlew --no-daemon --console=plain assembleDebug lintDebug testDebugUnitTest assembleDebugAndroidTest
      - name: Inspect debug APK permissions
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee app/build/apk-permissions.txt
          test "$(grep -c '^uses-permission:' app/build/apk-permissions.txt)" = 1
          grep -qx "uses-permission: name='android.permission.INTERNET'" app/build/apk-permissions.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > app/build/apk-badging.txt
          if grep -q '^application-debuggable' app/build/apk-badging.txt; then echo 'Preview must not be debuggable'; exit 1; fi
      - name: Record source and debug-signing identity
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/signing-certificate.txt
          python3 - <<'PYMETA'
          import json, pathlib, subprocess
          metadata = {
              "source_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "version_name": "0.1.0-preview", "version_code": 1,
              "gradle": "8.13", "agp": "8.13.2", "compile_sdk": 36, "target_sdk": 36,
              "build_tools": "35.0.0", "java": "17", "signing": "ephemeral CI debug key", "debuggable": False,
              "warning": "Not a signed production release. Different runs may use different debug certificates; in-place updates are not guaranteed."
          }
          pathlib.Path("app/build/outputs/apk/debug/build-metadata.json").write_text(json.dumps(metadata, indent=2) + "\n")
          PYMETA
      - name: Create APK checksum
        run: |
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > SHA256SUMS
      - name: Upload preview APK (debug signed, not a release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bridge-reader-preview-apk-${{ github.run_id }}
          path: |
            android-client/app/build/outputs/apk/debug/app-debug.apk
            android-client/app/build/outputs/apk/debug/SHA256SUMS
            android-client/app/build/outputs/apk/debug/build-metadata.json
            android-client/app/build/outputs/apk/debug/signing-certificate.txt
          retention-days: 14
          if-no-files-found: error
      - name: Upload test reports only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-preview-reports-${{ github.run_id }}
          path: |
            android-client/app/build/reports/
            android-client/app/build/test-results/
            android-client/app/build/apk-permissions.txt
          retention-days: 1
          if-no-files-found: ignore

  instrumentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Gradle wrapper JAR
        working-directory: android-client
        run: sha256sum -c gradle/wrapper/gradle-wrapper.jar.sha256
      - name: Bootstrap checksum-pinned Android SDK
        working-directory: android-client
        run: bash scripts/setup-ci-sdk.sh
      - name: Offline WebView and manifest acceptance on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          disable-linux-hw-accel: auto
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: cd android-client && bash ./gradlew --no-daemon --console=plain connectedDebugAndroidTest
      - name: Upload synthetic instrumentation results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-preview-instrumentation-${{ github.run_id }}
          path: android-client/app/build/reports/androidTests/
          retention-days: 1
          if-no-files-found: ignore
